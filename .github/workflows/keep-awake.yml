# Keeps the Render free instance from spinning down (it sleeps after 15 idle
# minutes and then shows Render's "SERVICE WAKING UP" page to visitors, and
# serves "Disallow: /" in robots.txt to Google).
#
# GitHub's scheduler can start runs late, so each run keeps pinging every
# 5 minutes for ~60 minutes, and a new run starts every 20 minutes and
# replaces the old one. Coverage stays continuous even if a schedule slips.
name: Keep site awake

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Ping every 5 minutes for an hour
        run: |
          for i in $(seq 1 13); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://vaishnavimobilepoint.in/api/health || echo "000")
            echo "$(date -u +%H:%M:%S) /api/health -> $code"
            [ "$i" -lt 13 ] && sleep 300
          done
