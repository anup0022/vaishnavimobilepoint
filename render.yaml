# Render blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the Docker image in ./Dockerfile as a single web service.
#
# NOTE ON DATA. The app keeps bookings, repair tickets, messages, reviews and
# uploaded photos on the local filesystem (SQLite + uploads/). This service
# runs on Render's FREE plan, whose filesystem is wiped on every deploy,
# restart and 15-minute idle spin-down; the catalogue and settings re-seed
# from server/db.js on the next boot.
#
# What keeps the data anyway, for free: Litestream (litestream.yml,
# vmp-entrypoint.sh) restores the database from S3-compatible object storage
# on every boot and streams each change back within about a second. Product
# photos are stored in the database, so they are covered too. It switches on
# when these are set in the dashboard's Environment tab — they are secrets,
# so they are deliberately not declared here:
#
#   LITESTREAM_REPLICA_URL        s3://<bucket>/vaishnavi?endpoint=<https://...>&region=<region>
#   LITESTREAM_ACCESS_KEY_ID      a key that can only reach that bucket
#   LITESTREAM_SECRET_ACCESS_KEY
#
# EPHEMERAL=true below describes the host. On its own it switches the
# booking, contact and review forms and repair tracking over to WhatsApp, so
# no customer is handed a ticket number for a job about to be wiped. Once
# LITESTREAM_REPLICA_URL is set the data is safe and they come back by
# themselves (server/util.js). If the storage cannot be reached at boot, the
# container stops rather than start on an empty database.

services:
  - type: web
    name: vaishnavimobilepoint
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    # Render adds www. automatically and redirects it to the apex.
    domains:
      - vaishnavimobilepoint.in

    envVars:
      - key: NODE_ENV
        value: production

      # The free plan's disk is wiped. Forms and tracking still work once
      # Litestream is configured (see the note at the top).
      - key: EPHEMERAL
        value: "true"

      # Drives canonical URLs, robots.txt and sitemap.xml.
      - key: SITE_URL
        value: https://vaishnavimobilepoint.in

      # Render's proxy sits in front of the container. 1 is the conservative
      # count: trusting more hops than exist would let a caller spoof req.ip.
      - key: TRUST_PROXY
        value: "1"

      - key: DATA_DIR
        value: /app/var/data
      - key: UPLOAD_DIR
        value: /app/var/uploads

      - key: ADMIN_USERNAME
        value: admin

      # Generated by Render on first deploy, so no secret is ever typed or
      # committed. Read ADMIN_PASSWORD from the service's Environment tab.
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
