# Render blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the Docker image in ./Dockerfile as a single web service.
#
# NOTE ON DATA. The app keeps bookings, messages, reviews, stock and uploaded
# photos on the local filesystem (SQLite + uploads/). Render's *free* instances
# have an ephemeral filesystem: everything under DATA_DIR and UPLOAD_DIR is
# wiped on every deploy, restart and 15-minute idle spin-down, and the catalogue
# re-seeds itself from server/db.js on the next boot. The storefront therefore
# looks correct on free, but nothing a customer or staff member *writes*
# survives. Persistent disks require a paid instance — uncomment the `disk`
# block and switch `plan` to `starter` to keep the data.

services:
  - type: web
    name: vaishnavimobilepoint
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      # Drives canonical URLs, robots.txt and sitemap.xml.
      - key: SITE_URL
        value: https://vaishnavimobilepoint.in

      # Render terminates TLS one hop in front of the container, so Express
      # must read the client IP from X-Forwarded-For for the rate limiter.
      - key: TRUST_PROXY
        value: "1"

      - key: DATA_DIR
        value: /app/var/data
      - key: UPLOAD_DIR
        value: /app/var/uploads

      - key: ADMIN_USERNAME
        value: admin

      # sync: false means Render prompts for these in the dashboard and never
      # stores them in this file. SESSION_SECRET must be >= 32 chars or the
      # server refuses to boot in production: openssl rand -hex 32
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

    # Paid plans only. One disk covers both the database and the uploads,
    # which is why they share the /app/var parent above.
    # disk:
    #   name: vmp-data
    #   mountPath: /app/var
    #   sizeGB: 1
