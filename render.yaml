# Render blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the Docker image in ./Dockerfile as a single web service.
#
# NOTE ON DATA. The app keeps bookings, repair tickets, messages, reviews and
# uploaded photos on the local filesystem (SQLite + uploads/). This service
# runs on Render's FREE plan, whose filesystem is wiped on every deploy,
# restart and 15-minute idle spin-down; the catalogue and settings re-seed
# from server/db.js on the next boot.
#
# EPHEMERAL=true below is what makes that safe rather than silently lossy:
# the booking, contact and review endpoints return 503 and the storefront
# offers WhatsApp and the phone number in their place, so no customer is
# ever handed a ticket number for a job the shop will never see. Repair
# tracking by ticket number needs data that survives a restart, so it stays
# on WhatsApp too until the database has somewhere permanent to live.
#
# Once it does — a persistent disk (paid plans) or free external storage —
# set EPHEMERAL to "false" and the forms and tracking come back on their own.
# The container already starts as root just long enough to hand DATA_DIR and
# UPLOAD_DIR to the `node` user (vmp-entrypoint.sh), which a freshly mounted
# disk needs.

services:
  - type: web
    name: vaishnavimobilepoint
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    # Render adds www. automatically and redirects it to the apex.
    domains:
      - vaishnavimobilepoint.in

    envVars:
      - key: NODE_ENV
        value: production

      # Remove (or set to "false") once the data is kept somewhere permanent.
      - key: EPHEMERAL
        value: "true"

      # Drives canonical URLs, robots.txt and sitemap.xml.
      - key: SITE_URL
        value: https://vaishnavimobilepoint.in

      # Render's proxy sits in front of the container. 1 is the conservative
      # count: trusting more hops than exist would let a caller spoof req.ip.
      - key: TRUST_PROXY
        value: "1"

      - key: DATA_DIR
        value: /app/var/data
      - key: UPLOAD_DIR
        value: /app/var/uploads

      - key: ADMIN_USERNAME
        value: admin

      # Generated by Render on first deploy, so no secret is ever typed or
      # committed. Read ADMIN_PASSWORD from the service's Environment tab.
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
